name: NeutrinoCalendar
packages:
  # The code shared with the other Neutrino iOS apps: account identity, the
  # OAuth/PKCE flow, the E2EE key lifecycle and the sign-in screens.
  #
  # A local path, so the two repositories have to sit side by side. Swap this for
  # `url:` + `from:` once neutrino_shared_ios is pushed and tagged.
  NeutrinoShared:
    path: ../neutrino_shared_ios
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoCalendar:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoCalendar
    dependencies:
      - package: NeutrinoShared
        product: NeutrinoCore
      - package: NeutrinoShared
        product: NeutrinoAuth
      - package: NeutrinoShared
        product: NeutrinoCrypto
      - package: NeutrinoShared
        product: NeutrinoUI
      - target: NeutrinoCalendarWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.calendar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoCalendar/NeutrinoCalendar.entitlements
      properties:
        # Cross-app Keychain access group, declared by every Neutrino app. Holds the identity
        # keyring and nothing else — sessions stay namespaced per app. Calendar's own data isn't
        # encrypted, but attachments are Drive files, opened and added with this keyring.
        keychain-access-groups:
          # This app's own group first, and it must stay first: the *default* access group — where
          # an item written without an explicit group lands — is the first entry in this list.
          # Left implicit, the shared group below would become the default and this app's tokens
          # would land in a container the other apps can read.
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)com.neutrino.shared
        # App Group: the widgets' snapshot (WidgetSnapshot), and nothing else. Never tokens.
        com.apple.security.application-groups:
          - group.com.neutrino.calendar
        # No `applinks:` yet. `/open/event/<id>` has to be added to the apple-app-site-association
        # document in the Drive repository first; see agent_docs/road_map.md.
    info:
      path: NeutrinoCalendar/Info.plist
      properties:
        CFBundleName: Calendar
        CFBundleDisplayName: Calendar
        # "Calendar" is Apple's app's name too, so Siri also answers to these in the App Shortcut
        # phrases ("What's next in Neutrino"); see Intents/CalendarIntents.swift.
        INAlternativeAppNames:
          - INAlternativeAppName: Neutrino Calendar
          - INAlternativeAppName: Neutrino
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Background refresh re-syncs reminders so their notifications are planned before they
        # are due; see BackgroundRefresh.swift.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.neutrino.calendar.refresh
        # The next event on the Lock Screen and in the Dynamic Island; see LiveActivities.swift.
        NSSupportsLiveActivities: true
        # What a tap on a widget or the Live Activity opens: neutrinocalendar://event/<link> or
        # neutrinocalendar://day/<yyyy-MM-dd> (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.neutrino.calendar
            CFBundleURLSchemes:
              - neutrinocalendar
        # Puts Calendar in the share sheet and "Open in…" for `.ics` files and Mail invites; the
        # file opens as a new event through onOpenURL (ICSImport). Alternate, not Owner: Apple's
        # Calendar stays the default for a tap. Not opened in place, so iOS hands over a copy in
        # Documents/Inbox, which the app deletes once read.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: iCalendar Event
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.ical.ics
              - public.calendar-event
        # The system declares this already; imported so the type resolves even where it doesn't.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.ical.ics
            UTTypeConformsTo:
              - public.calendar-event
              - public.text
            UTTypeDescription: iCalendar File
            UTTypeTagSpecification:
              public.filename-extension:
                - ics
                - ical
                - ifb
                - icalendar
              public.mime-type:
                - text/calendar

  # Widgets and the Live Activity. No network and no Keychain: everything they show comes from
  # the snapshot the app writes into the App Group. As in Drive's share extension, the few files
  # both sides need are compiled into both rather than put in a framework: NeutrinoCalendar/Shared.
  NeutrinoCalendarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NeutrinoCalendarWidgets
      - path: NeutrinoCalendar/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.calendar.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # 16.2 for the Live Activity's stale date (see EventActivityAttributes). The app itself
        # still runs on 16.0 and 16.1, without widgets.
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: NeutrinoCalendarWidgets/NeutrinoCalendarWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.neutrino.calendar
    info:
      path: NeutrinoCalendarWidgets/Info.plist
      properties:
        CFBundleName: Calendar
        CFBundleDisplayName: Calendar
        # Must match the app's, or the upload is rejected; deploy_testflight.sh bumps both.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NeutrinoCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoCalendarTests
    dependencies:
      - target: NeutrinoCalendar
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
